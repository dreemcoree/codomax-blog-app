<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlogSpace | Create Blog</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="create">
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">BlogSpace</a>
      <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">☰</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="create-blog.html">Create Blog</a></li>
        <li id="authLinks" style="display:flex;gap:1.5rem">
          <a href="login.html">Login</a>
          <a href="register.html" class="btn">Register</a>
        </li>
      </ul>
    </div>
  </header>

  <main class="form-wrapper">
    <div class="form-box wide">
      <h2>Create a new blog</h2>
      <p class="sub">Write something worth reading.</p>
      <div id="msg" class="msg"></div>
      <form id="blogForm">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" placeholder="An interesting title" required />
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="">Select a category</option>
            <option>Web Dev</option>
            <option>JavaScript</option>
            <option>Design</option>
            <option>Career</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="content">Content</label>
          <textarea id="content" name="content" placeholder="Write your blog here..." required></textarea>
        </div>
        <button type="submit" class="btn">Publish</button>
        <a href="dashboard.html" class="btn btn-outline">Cancel</a>
      </form>
    </div>
  </main>

  <footer><div class="container">© 2026 BlogSpace · Codomax Internship </div></footer>
  <script src="js/main.js"></script>
</body>
</html>
