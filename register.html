<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlogSpace | Register</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="register">
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">BlogSpace</a>
      <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">☰</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="create-blog.html">Create Blog</a></li>
        <li id="authLinks" style="display:flex;gap:1.5rem">
          <a href="login.html">Login</a>
          <a href="register.html" class="btn">Register</a>
        </li>
      </ul>
    </div>
  </header>

  <main class="form-wrapper">
    <div class="form-box">
      <h2>Create your account</h2>
      <p class="sub">Join BlogSpace and start publishing.</p>
      <div id="msg" class="msg"></div>
      <form id="registerForm">
        <div class="form-group">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Minimum 6 characters" required />
        </div>
        <div class="form-group">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" name="confirm" placeholder="Repeat password" required />
        </div>
        <button type="submit" class="btn btn-block">Register</button>
      </form>
      <p class="form-footer">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>

  <footer><div class="container">© 2026 BlogSpace · Codomax Internship Project</div></footer>
  <script src="js/main.js"></script>
</body>
</html>
